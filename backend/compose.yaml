services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    init: true
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOCALE: pt_BR
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      DB_FOREIGN_KEYS: "true"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/api/products?per_page=1') === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  vendor:
