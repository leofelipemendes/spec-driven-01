openapi: 3.1.0
info:
  title: Product Catalog API
  version: 1.0.0
  description: API JSON para cadastro e consulta paginada de produtos.
servers:
  - url: http://localhost:8000/api
    description: Ambiente local de desenvolvimento
paths:
  /products:
    get:
      summary: Listar produtos ativos
      description: >
        Retorna produtos ativos em ordem crescente de identificador.
        Filtros enviados em conjunto são combinados com AND. Nome e categoria
        usam correspondência parcial sem distinção de caixa ASCII e são
        sensíveis a acentos. Os links de paginação preservam os filtros.
        preço e quantidade usam igualdade exata.
      parameters:
        - in: query
          name: name
          schema:
            type: string
            maxLength: 255
        - in: query
          name: price
          schema:
            type: number
            minimum: 0
        - in: query
          name: category
          schema:
            type: string
            maxLength: 255
        - in: query
          name: quantity
          schema:
            type: integer
            minimum: 0
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        "200":
          description: Página de produtos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Cadastrar produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Produto criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/{product}:
    parameters:
      - in: path
        name: product
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Consultar produto
      responses:
        "200":
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Substituir os dados do produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Atualizar parcialmente o produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchInput"
      responses:
        "200":
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Excluir produto logicamente
      responses:
        "204":
          description: Produto excluído logicamente; resposta sem corpo.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    ProductInput:
      type: object
      additionalProperties: false
      required:
        - name
        - price
        - category
        - quantity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Nome não vazio após remoção de espaços externos.
        price:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
          description: Valor decimal não negativo com até duas casas, enviado como texto para preservar precisão.
        category:
          type: string
          minLength: 1
          maxLength: 255
        quantity:
          type: integer
          minimum: 0
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - price
        - category
        - quantity
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: string
          pattern: "^(0|[1-9][0-9]*)\\.[0-9]{2}$"
          readOnly: true
          description: Preço retornado como texto decimal canônico com duas casas.
        category:
          type: string
          minLength: 1
          maxLength: 255
        quantity:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ProductPatchInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
        category:
          type: string
          minLength: 1
          maxLength: 255
        quantity:
          type: integer
          minimum: 0
    ProductEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Product"
    ProductPage:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        links:
          type: object
          properties:
            first:
              type: [string, "null"]
              format: uri
            last:
              type: [string, "null"]
              format: uri
            prev:
              type: [string, "null"]
              format: uri
            next:
              type: [string, "null"]
              format: uri
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: [integer, "null"]
            last_page:
              type: integer
            per_page:
              type: integer
            to:
              type: [integer, "null"]
            total:
              type: integer
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    ValidationError:
      description: Dados inválidos; nenhuma alteração foi aplicada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Produto inexistente ou excluído logicamente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
